<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Detail — Preamble Admin</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <h1>Preamble</h1>
        <span>Admin Panel</span>
      </div>
      <nav class="sidebar-nav">
        <a href="/dashboard" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Dashboard
        </a>
        <a href="/users" class="nav-item active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Users
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-avatar" id="adminAvatar"></div>
          <div class="user-meta">
            <div class="user-name" id="adminName">Admin</div>
            <div class="user-email" id="adminEmail">admin@email.com</div>
          </div>
        </div>
        <button class="logout-btn" onclick="logout()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Sign Out
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <a href="/users" class="back-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Back to Users
      </a>

      <!-- User Header -->
      <div class="user-detail-header" id="userHeader">
        <div class="loading"><div class="spinner"></div> Loading user...</div>
      </div>

      <!-- Tabs -->
      <div class="tabs">
        <button class="tab active" onclick="switchTab('tasks')">Tasks</button>
        <button class="tab" onclick="switchTab('info')">Info</button>
        <button class="tab" onclick="switchTab('tags')">Tag Overrides</button>
      </div>

      <!-- Tasks Tab -->
      <div id="tasksTab">
        <div class="card">
          <div class="task-list-header">
            <h3 id="taskCount">Tasks (0)</h3>
            <button class="btn btn-primary btn-sm" onclick="openAddTaskModal()">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              Add Task
            </button>
          </div>
          <div id="tasksList">
            <div class="loading"><div class="spinner"></div> Loading tasks...</div>
          </div>
        </div>
      </div>

      <!-- Info Tab -->
      <div id="infoTab" style="display: none;">
        <div class="card">
          <div class="card-header"><h3>User Information</h3></div>
          <div class="card-body" id="userInfoBody">
            <div class="loading"><div class="spinner"></div> Loading...</div>
          </div>
        </div>
      </div>

      <!-- Tags Tab -->
      <div id="tagsTab" style="display: none;">
        <div class="card">
          <div class="card-header"><h3>Tag Overrides</h3></div>
          <div class="card-body" id="tagsList">
            <div class="loading"><div class="spinner"></div> Loading...</div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Task Modal (Add/Edit) -->
  <div class="modal-overlay" id="taskModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="taskModalTitle">Add Task</h3>
        <button class="modal-close" onclick="closeTaskModal()">&times;</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="taskDocId">
        <div class="form-group">
          <label>Title</label>
          <input type="text" class="form-control" id="taskTitle" placeholder="Task title...">
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea class="form-control" id="taskDescription" placeholder="Optional description..."></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Priority</label>
            <select class="form-control" id="taskPriority">
              <option value="0">None</option>
              <option value="1">Low</option>
              <option value="2">Medium</option>
              <option value="3">High</option>
            </select>
          </div>
          <div class="form-group">
            <label>Status</label>
            <select class="form-control" id="taskStatus">
              <option value="false">Pending</option>
              <option value="true">Completed</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Deadline Time</label>
            <input type="text" class="form-control" id="taskDeadline" placeholder="HH:mm or yyyy-MM-dd">
          </div>
          <div class="form-group">
            <label>Tags</label>
            <input type="text" class="form-control" id="taskTags" placeholder="Comma-separated tags">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Source</label>
            <select class="form-control" id="taskSource">
              <option value="local">Local</option>
              <option value="google_calendar">Google Calendar</option>
              <option value="google_tasks">Google Tasks</option>
            </select>
          </div>
          <div class="form-group">
            <label>Recurrence</label>
            <select class="form-control" id="taskRecurrence">
              <option value="">None</option>
              <option value="daily">Daily</option>
              <option value="weekly">Weekly</option>
              <option value="monthly">Monthly</option>
              <option value="yearly">Yearly</option>
            </select>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeTaskModal()">Cancel</button>
        <button class="btn btn-primary" id="taskSaveBtn" onclick="saveTask()">Save Task</button>
      </div>
    </div>
  </div>

  <!-- Delete Confirmation Modal -->
  <div class="modal-overlay" id="deleteModal">
    <div class="modal" style="width: 400px;">
      <div class="modal-header">
        <h3>Delete Task</h3>
        <button class="modal-close" onclick="closeDeleteModal()">&times;</button>
      </div>
      <div class="modal-body">
        <p style="color: var(--gray-300);">Are you sure you want to delete this task? This action cannot be undone.</p>
        <p style="margin-top: 0.75rem; font-weight: 600;" id="deleteTaskTitle"></p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeDeleteModal()">Cancel</button>
        <button class="btn btn-danger" id="deleteConfirmBtn" onclick="confirmDeleteTask()">Delete</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="/js/app.js"></script>
  <script>
    let currentUser = null;
    let currentTasks = [];
    let currentTagOverrides = [];
    let editingDocId = null;
    let deletingDocId = null;

    const uid = window.location.pathname.split('/').pop();

    document.addEventListener('DOMContentLoaded', async () => {
      await checkAuth();
      loadUserDetail();
    });

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById('tasksTab').style.display = 'none';
      document.getElementById('infoTab').style.display = 'none';
      document.getElementById('tagsTab').style.display = 'none';

      if (tab === 'tasks') {
        document.getElementById('tasksTab').style.display = '';
        document.querySelectorAll('.tab')[0].classList.add('active');
      } else if (tab === 'info') {
        document.getElementById('infoTab').style.display = '';
        document.querySelectorAll('.tab')[1].classList.add('active');
      } else if (tab === 'tags') {
        document.getElementById('tagsTab').style.display = '';
        document.querySelectorAll('.tab')[2].classList.add('active');
      }
    }

    async function loadUserDetail() {
      try {
        const res = await fetch(`/api/users/${uid}`);
        if (!res.ok) throw new Error('User not found');
        const data = await res.json();
        
        currentUser = data.user;
        currentTasks = data.tasks || [];
        currentTagOverrides = data.tagOverrides || [];

        renderUserHeader();
        renderTasks();
        renderUserInfo();
        renderTagOverrides();
      } catch (err) {
        console.error('Failed to load user:', err);
        document.getElementById('userHeader').innerHTML = 
          '<div class="empty-state"><h4>User not found</h4></div>';
      }
    }

    function renderUserHeader() {
      const u = currentUser;
      const avatarHtml = u.photoURL 
        ? `<img src="${u.photoURL}" alt="avatar">` 
        : `<div style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-size:1.5rem;font-weight:900;color:var(--gray-400);">${(u.email || '?')[0].toUpperCase()}</div>`;
      
      document.getElementById('userHeader').innerHTML = `
        <div class="user-detail-avatar">${avatarHtml}</div>
        <div class="user-detail-info">
          <h2>${escapeHtml(u.displayName || u.email || 'Unknown')}</h2>
          <div class="user-uid">${u.uid}</div>
          <div class="user-detail-meta">
            <div class="meta-item">Email: <strong>${escapeHtml(u.email)}</strong></div>
            <div class="meta-item">Tasks: <strong>${currentTasks.length}</strong></div>
            <div class="meta-item">Status: ${u.blocked 
              ? '<span class="badge badge-blocked">Blocked</span>' 
              : '<span class="badge badge-active">Active</span>'}</div>
          </div>
        </div>
        <div class="user-detail-actions">
          <button class="btn ${u.blocked ? 'btn-primary' : 'btn-danger'}" onclick="toggleBlock()">
            ${u.blocked ? 'Unblock User' : 'Block User'}
          </button>
        </div>
      `;
    }

    function renderTasks() {
      document.getElementById('taskCount').textContent = `Tasks (${currentTasks.length})`;
      const container = document.getElementById('tasksList');

      if (currentTasks.length === 0) {
        container.innerHTML = '<div class="empty-state"><h4>No tasks yet</h4><p style="color:var(--gray-500);">Add a task using the button above</p></div>';
        return;
      }

      const priorityLabels = ['None', 'Low', 'Medium', 'High'];
      const sorted = [...currentTasks].sort((a, b) => (b.updatedTimestamp || 0) - (a.updatedTimestamp || 0));

      container.innerHTML = sorted.map(t => `
        <div class="task-item">
          <div class="task-check ${t.isCompleted ? 'completed' : ''}"></div>
          <div class="task-content">
            <div class="task-title ${t.isCompleted ? 'completed-text' : ''}">${escapeHtml(t.title)}</div>
            <div class="task-meta">
              <span>${t.createdDate || 'No date'}</span>
              ${t.deadlineTime ? `<span>⏰ ${t.deadlineTime}</span>` : ''}
              ${t.priority > 0 ? `<span class="badge badge-priority-${t.priority}">${priorityLabels[t.priority]}</span>` : ''}
              ${t.tags ? `<span>🏷 ${t.tags}</span>` : ''}
              ${t.source !== 'local' ? `<span>📡 ${t.source}</span>` : ''}
              ${t.description ? `<span>📝 ${t.description.substring(0, 40)}${t.description.length > 40 ? '...' : ''}</span>` : ''}
            </div>
          </div>
          <div class="task-actions">
            <button class="btn btn-ghost btn-sm btn-icon" onclick="openEditTaskModal('${t.docId}')" title="Edit">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            </button>
            <button class="btn btn-ghost btn-sm btn-icon" onclick="openDeleteModal('${t.docId}', '${escapeHtml(t.title).replace(/'/g, "\\'")}')" title="Delete" style="color: var(--danger);">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            </button>
          </div>
        </div>
      `).join('');
    }

    function renderUserInfo() {
      const u = currentUser;
      document.getElementById('userInfoBody').innerHTML = `
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
          <div class="form-group">
            <label>UID</label>
            <div style="font-family: monospace; font-size: 0.8125rem; color: var(--gray-300); word-break: break-all;">${u.uid}</div>
          </div>
          <div class="form-group">
            <label>Email</label>
            <div style="color: var(--gray-300);">${escapeHtml(u.email)}</div>
          </div>
          <div class="form-group">
            <label>Display Name</label>
            <div style="color: var(--gray-300);">${escapeHtml(u.displayName || 'N/A')}</div>
          </div>
          <div class="form-group">
            <label>Account Created</label>
            <div style="color: var(--gray-300);">${u.creationTime || 'N/A'}</div>
          </div>
          <div class="form-group">
            <label>Last Sign In</label>
            <div style="color: var(--gray-300);">${u.lastSignInTime || 'N/A'}</div>
          </div>
          <div class="form-group">
            <label>Last Seen (Firestore)</label>
            <div style="color: var(--gray-300);">${u.lastSeenAt ? formatDate(u.lastSeenAt) : 'N/A'}</div>
          </div>
          <div class="form-group">
            <label>Auth Disabled</label>
            <div style="color: var(--gray-300);">${u.disabled ? 'Yes' : 'No'}</div>
          </div>
          <div class="form-group">
            <label>Blocked (Firestore)</label>
            <div style="color: var(--gray-300);">${u.blocked ? 'Yes' : 'No'}</div>
          </div>
        </div>
      `;
    }

    function renderTagOverrides() {
      const container = document.getElementById('tagsList');
      if (currentTagOverrides.length === 0) {
        container.innerHTML = '<div class="empty-state"><h4>No tag overrides</h4></div>';
        return;
      }
      container.innerHTML = `
        <table style="width:100%;">
          <thead><tr><th>Google ID</th><th>Tags</th><th>Updated</th></tr></thead>
          <tbody>
            ${currentTagOverrides.map(t => `
              <tr>
                <td style="font-family:monospace;font-size:0.75rem;">${escapeHtml(t.googleId || t.docId)}</td>
                <td>${escapeHtml(t.tags || '')}</td>
                <td>${t.updatedTimestamp ? formatDate(t.updatedTimestamp) : 'N/A'}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    // ─── Block / Unblock ───
    async function toggleBlock() {
      const newBlocked = !currentUser.blocked;
      const action = newBlocked ? 'block' : 'unblock';
      if (!confirm(`Are you sure you want to ${action} this user?`)) return;

      try {
        const res = await fetch(`/api/users/${uid}/block`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ blocked: newBlocked })
        });
        const data = await res.json();
        if (data.success) {
          currentUser.blocked = newBlocked;
          currentUser.disabled = newBlocked;
          renderUserHeader();
          showToast(`User ${action}ed successfully`, 'success');
        } else {
          throw new Error(data.error);
        }
      } catch (err) {
        showToast(`Failed to ${action} user: ${err.message}`, 'error');
      }
    }

    // ─── Task Modal ───
    function openAddTaskModal() {
      editingDocId = null;
      document.getElementById('taskModalTitle').textContent = 'Add Task';
      document.getElementById('taskSaveBtn').textContent = 'Create Task';
      document.getElementById('taskDocId').value = '';
      document.getElementById('taskTitle').value = '';
      document.getElementById('taskDescription').value = '';
      document.getElementById('taskPriority').value = '0';
      document.getElementById('taskStatus').value = 'false';
      document.getElementById('taskDeadline').value = '';
      document.getElementById('taskTags').value = '';
      document.getElementById('taskSource').value = 'local';
      document.getElementById('taskRecurrence').value = '';
      document.getElementById('taskModal').classList.add('active');
    }

    function openEditTaskModal(docId) {
      const task = currentTasks.find(t => t.docId === docId);
      if (!task) return;

      editingDocId = docId;
      document.getElementById('taskModalTitle').textContent = 'Edit Task';
      document.getElementById('taskSaveBtn').textContent = 'Update Task';
      document.getElementById('taskDocId').value = docId;
      document.getElementById('taskTitle').value = task.title || '';
      document.getElementById('taskDescription').value = task.description || '';
      document.getElementById('taskPriority').value = String(task.priority || 0);
      document.getElementById('taskStatus').value = String(task.isCompleted || false);
      document.getElementById('taskDeadline').value = task.deadlineTime || '';
      document.getElementById('taskTags').value = task.tags || '';
      document.getElementById('taskSource').value = task.source || 'local';
      document.getElementById('taskRecurrence').value = task.recurrenceType || '';
      document.getElementById('taskModal').classList.add('active');
    }

    function closeTaskModal() {
      document.getElementById('taskModal').classList.remove('active');
      editingDocId = null;
    }

    async function saveTask() {
      const title = document.getElementById('taskTitle').value.trim();
      if (!title) {
        showToast('Title is required', 'error');
        return;
      }

      const taskData = {
        title,
        description: document.getElementById('taskDescription').value.trim() || null,
        priority: parseInt(document.getElementById('taskPriority').value),
        isCompleted: document.getElementById('taskStatus').value === 'true',
        deadlineTime: document.getElementById('taskDeadline').value.trim() || null,
        tags: document.getElementById('taskTags').value.trim() || null,
        source: document.getElementById('taskSource').value,
        recurrenceType: document.getElementById('taskRecurrence').value || null
      };

      try {
        let res;
        if (editingDocId) {
          res = await fetch(`/api/tasks/${encodeURIComponent(editingDocId)}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(taskData)
          });
        } else {
          res = await fetch(`/api/users/${uid}/tasks`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(taskData)
          });
        }

        const data = await res.json();
        if (data.success) {
          closeTaskModal();
          showToast(editingDocId ? 'Task updated' : 'Task created', 'success');
          loadUserDetail();
        } else {
          throw new Error(data.error);
        }
      } catch (err) {
        showToast(`Failed to save task: ${err.message}`, 'error');
      }
    }

    // ─── Delete Task ───
    function openDeleteModal(docId, title) {
      deletingDocId = docId;
      document.getElementById('deleteTaskTitle').textContent = title;
      document.getElementById('deleteModal').classList.add('active');
    }

    function closeDeleteModal() {
      document.getElementById('deleteModal').classList.remove('active');
      deletingDocId = null;
    }

    async function confirmDeleteTask() {
      if (!deletingDocId) return;
      try {
        const res = await fetch(`/api/tasks/${encodeURIComponent(deletingDocId)}`, { method: 'DELETE' });
        const data = await res.json();
        if (data.success) {
          closeDeleteModal();
          showToast('Task deleted', 'success');
          loadUserDetail();
        } else {
          throw new Error(data.error);
        }
      } catch (err) {
        showToast(`Failed to delete task: ${err.message}`, 'error');
      }
    }
  </script>
</body>
</html>
