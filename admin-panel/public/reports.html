<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Problem Reports — Preamble Admin</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <h1>Preamble</h1>
        <span>Admin Panel</span>
      </div>
      <nav class="sidebar-nav">
        <a href="/dashboard" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Dashboard
        </a>
        <a href="/users" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Users
        </a>
        <a href="/groups" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><circle cx="19" cy="7" r="3"/><path d="M21 21v-2a3 3 0 0 0-2-2.83"/></svg>
          Groups
        </a>
        <a href="/broadcasts" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
          Broadcasts
        </a>
        <a href="/notifications" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          Notifications
        </a>
        <a href="/reports" class="nav-item active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2h8l4 4v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h2"/><path d="M14 2v6h6"/><path d="M9 13h6"/><path d="M9 17h4"/></svg>
          Reports
        </a>
        <a href="/pm-messages" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          PM Messages
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-avatar" id="adminAvatar"></div>
          <div class="user-meta">
            <div class="user-name" id="adminName">Admin</div>
            <div class="user-email" id="adminEmail">admin@email.com</div>
          </div>
        </div>
        <button class="logout-btn" onclick="logout()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Sign Out
        </button>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header" style="display:flex;justify-content:space-between;gap:1rem;align-items:flex-start;">
        <div>
          <h2>Problem Reports</h2>
          <p>User-submitted issues with screenshots, videos, and resolution status.</p>
        </div>
        <button class="btn btn-ghost" onclick="loadReports()">Refresh</button>
      </div>

      <div class="card" style="margin-bottom:1rem;">
        <div style="padding:0.75rem 1.5rem;display:flex;flex-wrap:wrap;gap:0.5rem;align-items:center;">
          <span style="color:var(--gray-400);font-size:0.8rem;margin-right:0.5rem;">Status:</span>
          <button class="btn btn-ghost btn-sm filter-btn active" data-status="all" onclick="setReportFilter('all', this)">All</button>
          <button class="btn btn-ghost btn-sm filter-btn" data-status="open" onclick="setReportFilter('open', this)">Open</button>
          <button class="btn btn-ghost btn-sm filter-btn" data-status="in_progress" onclick="setReportFilter('in_progress', this)">In Review</button>
          <button class="btn btn-ghost btn-sm filter-btn" data-status="resolved" onclick="setReportFilter('resolved', this)">Resolved</button>
        </div>
      </div>

      <div class="card">
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Status</th>
                <th>Problem</th>
                <th>User</th>
                <th>Evidence</th>
                <th>Updated</th>
                <th style="width:120px">Actions</th>
              </tr>
            </thead>
            <tbody id="reportsBody">
              <tr><td colspan="6" class="loading"><div class="spinner"></div> Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="reportModal">
    <div class="modal" style="width:720px;">
      <div class="modal-header">
        <h3>Review Report</h3>
        <button class="modal-close" onclick="closeReportModal()">&times;</button>
      </div>
      <div class="modal-body" id="reportModalBody"></div>
      <div class="modal-footer">
        <button class="btn btn-danger" id="deleteReportBtn" style="display:none;margin-right:auto;" onclick="deleteCurrentReport()">Delete Report</button>
        <button class="btn btn-ghost" onclick="closeReportModal()">Cancel</button>
        <button class="btn btn-primary" onclick="saveReportStatus()">Save Status</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="/js/app.js?v=2"></script>
  <script>
    let reports = [];
    let reportFilter = 'all';
    let currentReport = null;

    document.addEventListener('DOMContentLoaded', async () => {
      await checkAuth();
      loadReports();
    });

    async function loadReports() {
      const body = document.getElementById('reportsBody');
      body.innerHTML = '<tr><td colspan="6" class="loading"><div class="spinner"></div> Loading...</td></tr>';
      try {
        const res = await fetch(`/api/problem-reports?status=${encodeURIComponent(reportFilter)}`);
        const data = await res.json();
        reports = data.reports || [];
        renderReports();
      } catch (err) {
        body.innerHTML = '<tr><td colspan="6" class="empty-state"><h4>Could not load reports</h4></td></tr>';
      }
    }

    function setReportFilter(status, btn) {
      reportFilter = status;
      document.querySelectorAll('.filter-btn').forEach(el => el.classList.remove('active'));
      btn.classList.add('active');
      loadReports();
    }

    function renderReports() {
      const body = document.getElementById('reportsBody');
      if (!reports.length) {
        body.innerHTML = '<tr><td colspan="6" class="empty-state"><h4>No problem reports found</h4><p>Reports from app settings will appear here.</p></td></tr>';
        return;
      }

      body.innerHTML = reports.map(report => `
        <tr>
          <td>${statusBadge(report.status)}</td>
          <td>
            <strong style="color:var(--white);">${escapeHtml(report.title || 'Problem report')}</strong>
            <div style="color:var(--gray-400);font-size:0.75rem;margin-top:0.25rem;max-width:360px;">${escapeHtml((report.description || '').slice(0, 140))}${(report.description || '').length > 140 ? '...' : ''}</div>
          </td>
          <td>
            <div style="color:var(--white);">${escapeHtml(report.userEmail || 'Unknown')}</div>
            <div style="color:var(--gray-500);font-size:0.72rem;font-family:monospace;">${escapeHtml(report.uid || '')}</div>
          </td>
          <td>${(report.attachments || []).length || 0} file${(report.attachments || []).length === 1 ? '' : 's'}</td>
          <td>${formatDate(report.updatedAt || report.createdAt)}</td>
          <td><button class="btn btn-ghost btn-sm" onclick="openReportModal('${report.id}')">Review</button></td>
        </tr>
      `).join('');
    }

    function openReportModal(id) {
      currentReport = reports.find(report => report.id === id);
      if (!currentReport) return;

      const attachments = currentReport.attachments || [];
      document.getElementById('reportModalBody').innerHTML = `
        <div class="report-detail-grid">
          <div>
            <label class="report-label">Title</label>
            <div class="report-value">${escapeHtml(currentReport.title || 'Problem report')}</div>
          </div>
          <div>
            <label class="report-label">Submitted</label>
            <div class="report-value">${formatDate(currentReport.createdAt)}</div>
          </div>
        </div>
        <div class="form-group">
          <label>User</label>
          <div class="report-value">${escapeHtml(currentReport.userEmail || currentReport.uid || 'Unknown')}</div>
        </div>
        <div class="form-group">
          <label>Description</label>
          <div class="report-description">${escapeHtml(currentReport.description || '')}</div>
        </div>
        <div class="form-group">
          <label>Evidence</label>
          ${renderAttachments(attachments)}
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Status</label>
            <select class="form-control" id="reportStatus">
              <option value="open" ${currentReport.status === 'open' ? 'selected' : ''}>Open</option>
              <option value="in_progress" ${currentReport.status === 'in_progress' ? 'selected' : ''}>In Review</option>
              <option value="resolved" ${currentReport.status === 'resolved' ? 'selected' : ''}>Resolved</option>
            </select>
          </div>
          <div class="form-group">
            <label>Device</label>
            <div class="report-value">${escapeHtml(currentReport.device || 'Unknown')} · SDK ${escapeHtml(String(currentReport.androidSdk || 'N/A'))}</div>
          </div>
        </div>
        <div class="form-group">
          <label>Admin note visible to user</label>
          <textarea class="form-control" id="adminNote" rows="4" placeholder="Example: We found the issue and shipped a fix.">${escapeHtml(currentReport.adminNote || '')}</textarea>
        </div>
      `;
      document.getElementById('deleteReportBtn').style.display = currentReport.status === 'resolved' ? 'inline-flex' : 'none';
      document.getElementById('reportModal').classList.add('active');
    }

    function closeReportModal() {
      document.getElementById('reportModal').classList.remove('active');
      document.getElementById('deleteReportBtn').style.display = 'none';
      currentReport = null;
    }

    async function saveReportStatus() {
      if (!currentReport) return;
      const status = document.getElementById('reportStatus').value;
      const adminNote = document.getElementById('adminNote').value.trim();

      try {
        const res = await fetch(`/api/problem-reports/${currentReport.id}/status`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status, adminNote })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to update report');
        showToast('Report status updated');
        closeReportModal();
        loadReports();
      } catch (err) {
        showToast(err.message || 'Failed to update report', 'error');
      }
    }

    async function deleteCurrentReport() {
      if (!currentReport) return;
      if (currentReport.status !== 'resolved') {
        showToast('Only resolved reports can be deleted.', 'error');
        return;
      }
      const confirmed = window.confirm('Delete this resolved report and all attached media? This cannot be undone.');
      if (!confirmed) return;

      try {
        const res = await fetch(`/api/problem-reports/${currentReport.id}`, { method: 'DELETE' });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed to delete report');
        showToast(`Report deleted. Removed ${data.deletedAttachments || 0} attachment(s).`);
        closeReportModal();
        loadReports();
      } catch (err) {
        showToast(err.message || 'Failed to delete report', 'error');
      }
    }

    function renderAttachments(attachments) {
      if (!attachments.length) return '<div class="report-value">No attachments</div>';
      return `<div class="report-attachments">${attachments.map(file => {
        const name = escapeHtml(file.name || 'Attachment');
        const size = formatBytes(file.sizeBytes || 0);
        if (file.contentType && file.contentType.startsWith('image/') && file.signedUrl) {
          return `<a class="report-thumb" href="${file.signedUrl}" target="_blank" rel="noreferrer"><img src="${file.signedUrl}" alt="${name}"><span>${name}<br>${size}</span></a>`;
        }
        return `<a class="report-file" href="${file.signedUrl || '#'}" target="_blank" rel="noreferrer">${name}<span>${size}</span></a>`;
      }).join('')}</div>`;
    }

    function statusBadge(status) {
      if (status === 'resolved') return '<span class="badge badge-completed">Resolved</span>';
      if (status === 'in_progress') return '<span class="badge badge-active">In Review</span>';
      return '<span class="badge badge-pending">Open</span>';
    }

    function formatBytes(bytes) {
      if (!bytes) return 'Unknown size';
      const mb = bytes / (1024 * 1024);
      if (mb >= 1) return `${mb.toFixed(1)} MB`;
      return `${Math.round(bytes / 1024)} KB`;
    }
  </script>
</body>
</html>
