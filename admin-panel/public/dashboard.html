<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Preamble Admin</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <h1>Preamble</h1>
        <span>Admin Panel</span>
      </div>
      <nav class="sidebar-nav">
        <a href="/dashboard" class="nav-item active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Dashboard
        </a>
        <a href="/users" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Users
        </a>
        <a href="/groups" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><circle cx="19" cy="7" r="3"/><path d="M21 21v-2a3 3 0 0 0-2-2.83"/></svg>
          Groups
        </a>
        <a href="/broadcasts" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
          Broadcasts
        </a>
        <a href="/notifications" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          Notifications
        </a>
        <a href="/pm-messages" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          PM Messages
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-avatar" id="adminAvatar"></div>
          <div class="user-meta">
            <div class="user-name" id="adminName">Admin</div>
            <div class="user-email" id="adminEmail">admin@email.com</div>
          </div>
        </div>
        <button class="logout-btn" onclick="logout()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Sign Out
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="page-header">
        <h2>Dashboard</h2>
        <p>Overview of your Preamble ecosystem</p>
      </div>

      <!-- Stats -->
      <div class="stats-grid" id="statsGrid">
        <div class="stat-card">
          <div class="stat-icon accent">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
          </div>
          <div class="stat-label">Total Users</div>
          <div class="stat-value" id="totalUsers">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon success">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          </div>
          <div class="stat-label">Total Tasks</div>
          <div class="stat-value" id="totalTasks">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon warning">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          </div>
          <div class="stat-label">Active Tasks</div>
          <div class="stat-value" id="activeTasks">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon success">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <div class="stat-label">Completed</div>
          <div class="stat-value" id="completedTasks">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon danger">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
          </div>
          <div class="stat-label">Blocked Users</div>
          <div class="stat-value" id="blockedUsers">—</div>
        </div>
      </div>

      <!-- Recent Users -->
      <div class="card">
        <div class="card-header">
          <h3>Recent Users</h3>
          <a href="/users" class="btn btn-ghost btn-sm">View All</a>
        </div>
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Email</th>
                <th>Tasks</th>
                <th>Status</th>
                <th>Last Active</th>
              </tr>
            </thead>
            <tbody id="recentUsersBody">
              <tr><td colspan="4" class="loading"><div class="spinner"></div> Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await checkAuth();
      loadStats();
      loadRecentUsers();
    });

    async function loadStats() {
      try {
        const res = await fetch('/api/stats');
        const data = await res.json();
        document.getElementById('totalUsers').textContent = data.totalUsers;
        document.getElementById('totalTasks').textContent = data.totalTasks;
        document.getElementById('activeTasks').textContent = data.activeTasks;
        document.getElementById('completedTasks').textContent = data.completedTasks;
        document.getElementById('blockedUsers').textContent = data.blockedUsers;
      } catch (err) {
        console.error('Failed to load stats:', err);
      }
    }

    async function loadRecentUsers() {
      try {
        const res = await fetch('/api/users');
        const data = await res.json();
        const tbody = document.getElementById('recentUsersBody');
        
        if (!data.users || data.users.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" class="empty-state"><h4>No users found</h4></td></tr>';
          return;
        }

        // Sort by lastSeenAt and take top 5
        const users = data.users
          .sort((a, b) => (b.lastSeenAt || 0) - (a.lastSeenAt || 0))
          .slice(0, 5);

        tbody.innerHTML = users.map(u => `
          <tr class="clickable-row" onclick="window.location='/users/${u.uid}'">
            <td>${escapeHtml(u.email)}</td>
            <td>${u.taskCount}</td>
            <td>${u.blocked 
              ? '<span class="badge badge-blocked">Blocked</span>' 
              : '<span class="badge badge-active">Active</span>'}</td>
            <td>${u.lastSeenAt ? formatDate(u.lastSeenAt) : 'Never'}</td>
          </tr>
        `).join('');
      } catch (err) {
        console.error('Failed to load users:', err);
      }
    }
  </script>
</body>
</html>
