<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Broadcasts — Preamble Admin</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <h1>Preamble</h1>
        <span>Admin Panel</span>
      </div>
      <nav class="sidebar-nav">
        <a href="/dashboard" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Dashboard
        </a>
        <a href="/users" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Users
        </a>
        <a href="/groups" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><circle cx="19" cy="7" r="3"/><path d="M21 21v-2a3 3 0 0 0-2-2.83"/></svg>
          Groups
        </a>
        <a href="/broadcasts" class="nav-item active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
          Broadcasts
        </a>
        <a href="/notifications" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          Notifications
        </a>
        <a href="/pm-messages" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          PM Messages
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-avatar" id="adminAvatar"></div>
          <div class="user-meta">
            <div class="user-name" id="adminName">Admin</div>
            <div class="user-email" id="adminEmail">admin@email.com</div>
          </div>
        </div>
        <button type="button" class="logout-btn" onclick="logout()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Sign Out
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="page-header" style="display:flex;justify-content:space-between;align-items:flex-start;">
        <div>
          <h2>Broadcasts</h2>
          <p>Send in-app cards to all users — announcements, features, promotions, socials</p>
        </div>
        <button type="button" class="btn btn-primary" onclick="openCreateModal()">+ New Broadcast</button>
      </div>

      <!-- Quick Templates -->
      <div class="card" style="margin-bottom:1.5rem;">
        <div class="card-header"><h3>Quick Templates</h3></div>
        <div style="padding:1rem 1.5rem;display:flex;flex-wrap:wrap;gap:0.5rem;">
          <button type="button" class="btn btn-secondary" onclick="useTemplate('announcement')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14" style="margin-right:4px;"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
            Announcement
          </button>
          <button type="button" class="btn btn-secondary" onclick="useTemplate('update')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14" style="margin-right:4px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            App Update
          </button>
          <button type="button" class="btn btn-secondary" onclick="useTemplate('social')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14" style="margin-right:4px;"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/><line x1="10" y1="1" x2="10" y2="4"/><line x1="14" y1="1" x2="14" y2="4"/></svg>
            Follow Us
          </button>
          <button type="button" class="btn btn-secondary" onclick="useTemplate('review')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14" style="margin-right:4px;"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            Rate App
          </button>
          <button type="button" class="btn btn-secondary" onclick="useTemplate('promo')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14" style="margin-right:4px;"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
            Premium Upsell
          </button>
          <button type="button" class="btn btn-secondary" onclick="useTemplate('tip')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14" style="margin-right:4px;"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
            Feature Tip
          </button>
        </div>
      </div>

      <!-- Broadcasts List -->
      <div class="card">
        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th>Title</th>
                <th>Type</th>
                <th>Tags</th>
                <th>Priority</th>
                <th>Status</th>
                <th>Created</th>
                <th style="width:120px">Actions</th>
              </tr>
            </thead>
            <tbody id="broadcastsBody">
              <tr><td colspan="7" class="loading"><div class="spinner"></div> Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <!-- Create/Edit Modal -->
  <div class="modal-overlay" id="broadcastModal">
    <div class="modal" style="width:640px;">
      <div class="modal-header">
        <h3 id="modalTitle">New Broadcast</h3>
        <button type="button" class="modal-close" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Title *</label>
          <div style="display:flex;gap:8px;">
            <input type="text" class="form-control" id="fTitle" placeholder="e.g. Follow us on Instagram" style="flex:1;">
            <button type="button" class="btn btn-secondary" onclick="aiGenerate('broadcast')" title="Generate with AI">✨ AI</button>
          </div>
        </div>

        <div class="form-group">
          <label>Description</label>
          <textarea class="form-control" id="fDescription" placeholder="What should the user know?"></textarea>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Type</label>
            <select class="form-control" id="fType">
              <option value="announcement">Announcement</option>
              <option value="feature">Feature Discovery</option>
              <option value="promotion">Promotion / Offer</option>
              <option value="social">Social / Review</option>
            </select>
          </div>
          <div class="form-group">
            <label>Priority (higher = shown first)</label>
            <input type="number" class="form-control" id="fPriority" value="0" min="0" max="100">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label>Action Label</label>
            <input type="text" class="form-control" id="fActionLabel" placeholder="Open Now" value="Open Now">
          </div>
          <div class="form-group">
            <label>Feature Key (for feature type)</label>
            <select class="form-control" id="fFeatureKey">
              <option value="">None</option>
              <option value="theme_custom">Theme Customization</option>
              <option value="calendar_link">Google Calendar Link</option>
              <option value="voice_sync">Voice Task Sync</option>
              <option value="smart_breakdown">Smart Task Breakdown</option>
              <option value="permanent_notification">Persistent Notification</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label>External URL (opens browser)</label>
          <input type="url" class="form-control" id="fActionUrl" placeholder="https://instagram.com/preamble">
        </div>

        <div class="form-group">
          <label>Deep Link (opens in-app screen)</label>
          <select class="form-control" id="fDeepLink">
            <option value="">None</option>
            <option value="preamble://home">Home</option>
            <option value="preamble://settings">Settings</option>
            <option value="preamble://settings/theme">Settings &rarr; Theme</option>
            <option value="preamble://settings/calendar">Settings &rarr; Calendar</option>
            <option value="preamble://settings/notifications">Settings &rarr; Notifications</option>
            <option value="preamble://stats">Stats</option>
            <option value="preamble://calendar">Calendar</option>
          </select>
        </div>

        <div class="form-group">
          <label>Image URL (optional banner)</label>
          <input type="url" class="form-control" id="fImageUrl" placeholder="https://example.com/banner.jpg">
        </div>

        <div class="form-group">
          <label>Tags</label>
          <div id="tagChips" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;min-height:24px;"></div>
          <div style="display:flex;gap:8px;align-items:center;">
            <input type="text" class="form-control" id="fTagName" placeholder="Tag name" style="flex:1;">
            <input type="color" id="fTagColor" value="#6366F1" style="width:40px;height:36px;padding:2px;border:1px solid var(--glass-border);border-radius:var(--radius);background:transparent;cursor:pointer;">
            <button type="button" class="btn btn-secondary" onclick="addTag()" style="white-space:nowrap;">+ Add</button>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;">
            <button type="button" class="tag-preset" onclick="addPresetTag('New','#6366F1')" style="font-size:0.6875rem;padding:2px 8px;border:1px solid #6366F133;background:#6366F118;color:#6366F1;border-radius:12px;cursor:pointer;">New</button>
            <button type="button" class="tag-preset" onclick="addPresetTag('Update','#4CAF50')" style="font-size:0.6875rem;padding:2px 8px;border:1px solid #4CAF5033;background:#4CAF5018;color:#4CAF50;border-radius:12px;cursor:pointer;">Update</button>
            <button type="button" class="tag-preset" onclick="addPresetTag('Premium','#FF9800')" style="font-size:0.6875rem;padding:2px 8px;border:1px solid #FF980033;background:#FF980018;color:#FF9800;border-radius:12px;cursor:pointer;">Premium</button>
            <button type="button" class="tag-preset" onclick="addPresetTag('Social','#E91E63')" style="font-size:0.6875rem;padding:2px 8px;border:1px solid #E91E6333;background:#E91E6318;color:#E91E63;border-radius:12px;cursor:pointer;">Social</button>
            <button type="button" class="tag-preset" onclick="addPresetTag('Tip','#00BCD4')" style="font-size:0.6875rem;padding:2px 8px;border:1px solid #00BCD433;background:#00BCD418;color:#00BCD4;border-radius:12px;cursor:pointer;">Tip</button>
            <button type="button" class="tag-preset" onclick="addPresetTag('Review','#FF5722')" style="font-size:0.6875rem;padding:2px 8px;border:1px solid #FF572233;background:#FF572218;color:#FF5722;border-radius:12px;cursor:pointer;">Review</button>
            <button type="button" class="tag-preset" onclick="addPresetTag('Important','#F44336')" style="font-size:0.6875rem;padding:2px 8px;border:1px solid #F4433633;background:#F4433618;color:#F44336;border-radius:12px;cursor:pointer;">Important</button>
          </div>
          <input type="hidden" id="fTags">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label style="display:flex;align-items:center;gap:0.5rem;cursor:pointer;">
              <input type="checkbox" id="fDirectRedirect" style="width:auto;">
              Direct Redirect (skip detail sheet)
            </label>
          </div>
          <div class="form-group">
            <label style="display:flex;align-items:center;gap:0.5rem;cursor:pointer;">
              <input type="checkbox" id="fDismissible" checked style="width:auto;">
              User can dismiss
            </label>
          </div>
        </div>

        <div class="form-group">
          <label>Expires At (optional, leave empty for no expiry)</label>
          <input type="datetime-local" class="form-control" id="fExpiresAt">
        </div>

        <hr style="border-color:var(--glass-border);margin:1rem 0;">

        <div class="form-group">
          <label>Target Audience</label>
          <select class="form-control" id="fTargetType" onchange="toggleBroadcastTarget()">
            <option value="all">All Users</option>
            <option value="group">User Group</option>
          </select>
        </div>

        <div class="form-group" id="fTargetGroupField" style="display:none;">
          <label>Select Group</label>
          <select class="form-control" id="fTargetGroupId">
            <option value="">Loading groups...</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label style="display:flex;align-items:center;gap:0.5rem;cursor:pointer;">
              <input type="checkbox" id="fAutoNotify" style="width:auto;">
              Also send push notification
            </label>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-ghost" onclick="closeModal()">Cancel</button>
        <button type="button" class="btn btn-primary" id="modalSubmitBtn" onclick="submitBroadcast()">Create</button>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="/js/app.js"></script>
  <script>
    let editingId = null;
    let currentTags = [];

    function renderTagChips() {
      const container = document.getElementById('tagChips');
      container.innerHTML = currentTags.map((t, i) =>
        `<span style="display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:12px;font-size:0.75rem;font-weight:600;background:${t.color}22;color:${t.color};border:1px solid ${t.color}33;">
          ${escapeHtml(t.name)}
          <span onclick="removeTag(${i})" style="cursor:pointer;font-size:1rem;line-height:1;opacity:0.7;">&times;</span>
        </span>`
      ).join('');
      document.getElementById('fTags').value = JSON.stringify(currentTags);
    }

    function addTag() {
      const nameInput = document.getElementById('fTagName');
      const name = nameInput.value.trim();
      if (!name) return;
      const color = document.getElementById('fTagColor').value;
      currentTags.push({ name, color });
      nameInput.value = '';
      renderTagChips();
    }

    function addPresetTag(name, color) {
      if (currentTags.some(t => t.name === name)) return;
      currentTags.push({ name, color });
      renderTagChips();
    }

    function removeTag(index) {
      currentTags.splice(index, 1);
      renderTagChips();
    }

    document.addEventListener('DOMContentLoaded', async () => {
      await checkAuth();
      loadBroadcasts();
      loadBroadcastGroupOptions();
      document.getElementById('fTagName').addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); addTag(); }
      });
    });

    const TEMPLATES = {
      announcement: {
        title: 'Important Update',
        description: 'We have something exciting to share with you!',
        type: 'announcement',
        actionLabel: 'Learn More',
        priority: 50,
        tags: [{ name: 'Update', color: '#4CAF50' }]
      },
      update: {
        title: 'New Version Available!',
        description: 'We just shipped new features and improvements. Update now to get the best experience.',
        type: 'announcement',
        actionLabel: 'Update Now',
        priority: 80,
        tags: [{ name: 'New Version', color: '#2196F3' }],
        deepLink: 'preamble://home'
      },
      social: {
        title: 'Follow Us on Instagram',
        description: 'Stay updated with tips, tricks and behind-the-scenes content. Follow @preambleapp!',
        type: 'social',
        actionLabel: 'Follow Now',
        priority: 30,
        tags: [{ name: 'Social', color: '#E91E63' }],
        actionUrl: 'https://instagram.com/preambleapp',
        directRedirect: true
      },
      review: {
        title: 'Enjoying Preamble?',
        description: 'Your review helps us grow and build better features for you. It only takes a moment!',
        type: 'social',
        actionLabel: 'Rate Now',
        priority: 40,
        tags: [{ name: 'Review', color: '#FF9800' }],
        actionUrl: 'https://play.google.com/store/apps/details?id=com.theblankstate.preamble',
        directRedirect: true
      },
      promo: {
        title: 'Unlock Premium Features',
        description: 'Custom themes, advanced stats, and more — watch a quick ad to unlock for free!',
        type: 'promotion',
        actionLabel: 'Unlock Free',
        priority: 60,
        tags: [{ name: 'Premium', color: '#6366F1' }],
        deepLink: 'preamble://settings/theme'
      },
      tip: {
        title: 'Did You Know?',
        description: 'You can break down complex tasks into subtasks with AI. Try it on your next big task!',
        type: 'feature',
        actionLabel: 'Try Now',
        priority: 40,
        tags: [{ name: 'Tip', color: '#00BCD4' }],
        deepLink: 'preamble://home'
      }
    };

    function useTemplate(key) {
      const t = TEMPLATES[key];
      if (!t) return;
      openCreateModal();
      document.getElementById('fTitle').value = t.title || '';
      document.getElementById('fDescription').value = t.description || '';
      document.getElementById('fType').value = t.type || 'announcement';
      document.getElementById('fPriority').value = t.priority || 0;
      document.getElementById('fActionLabel').value = t.actionLabel || 'Open Now';
      document.getElementById('fActionUrl').value = t.actionUrl || '';
      document.getElementById('fDeepLink').value = t.deepLink || '';
      currentTags = JSON.parse(JSON.stringify(t.tags || []));
      renderTagChips();
      document.getElementById('fDirectRedirect').checked = t.directRedirect || false;
    }

    function toggleBroadcastTarget() {
      const type = document.getElementById('fTargetType').value;
      document.getElementById('fTargetGroupField').style.display = type === 'group' ? 'block' : 'none';
    }

    async function loadBroadcastGroupOptions() {
      try {
        const res = await fetch('/api/groups');
        const data = await res.json();
        const select = document.getElementById('fTargetGroupId');
        if (!data.groups || data.groups.length === 0) {
          select.innerHTML = '<option value="">No groups created yet</option>';
          return;
        }
        select.innerHTML = data.groups.map(g =>
          `<option value="${g.id}">${escapeHtml(g.name)} (${g.filterType})</option>`
        ).join('');
      } catch (err) {
        console.error('Failed to load groups:', err);
      }
    }

    async function loadBroadcasts() {
      try {
        const res = await fetch('/api/broadcasts');
        const data = await res.json();
        const tbody = document.getElementById('broadcastsBody');

        if (!data.broadcasts || data.broadcasts.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" class="empty-state"><h4>No broadcasts yet</h4><p>Create your first broadcast to reach all users</p></td></tr>';
          return;
        }

        tbody.innerHTML = data.broadcasts.map(b => {
          const typeColors = {
            announcement: 'accent',
            feature: 'success',
            promotion: 'warning',
            social: 'danger'
          };
          let parsedTags = b.tags || [];
          if (typeof parsedTags === 'string') { try { parsedTags = JSON.parse(parsedTags); } catch(e) { parsedTags = []; } }
          if (!Array.isArray(parsedTags)) parsedTags = [];
          const tagsHtml = parsedTags.map(t =>
            `<span class="badge" style="background:${t.color}22;color:${t.color};margin-right:4px;">${escapeHtml(t.name)}</span>`
          ).join('') || '<span style="color:var(--gray-600)">—</span>';

          return `
            <tr>
              <td style="font-weight:600;color:var(--white);max-width:200px;">
                <div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(b.title)}</div>
                ${b.description ? `<div style="font-size:0.6875rem;color:var(--gray-500);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;">${escapeHtml(b.description)}</div>` : ''}
              </td>
              <td><span class="badge badge-${b.active ? (typeColors[b.type] || 'accent') : 'priority-0'}" style="text-transform:capitalize;">${b.type}</span></td>
              <td>${tagsHtml}</td>
              <td>${b.priority}</td>
              <td>
                <span class="badge ${b.active ? 'badge-active' : 'badge-blocked'}" style="cursor:pointer;" onclick="toggleBroadcast('${b.id}')">
                  ${b.active ? 'Active' : 'Paused'}
                </span>
              </td>
              <td>${formatDate(b.createdAt)}</td>
              <td>
                <div style="display:flex;gap:4px;">
                  <button type="button" class="btn btn-ghost btn-sm btn-icon" onclick="editBroadcast('${b.id}')" title="Edit">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                  </button>
                  <button type="button" class="btn btn-ghost btn-sm btn-icon" onclick="deleteBroadcast('${b.id}')" title="Delete" style="color:var(--danger);">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                  </button>
                </div>
              </td>
            </tr>
          `;
        }).join('');
      } catch (err) {
        console.error('Failed to load broadcasts:', err);
        showToast('Failed to load broadcasts', 'error');
      }
    }

    // Store loaded broadcasts for editing
    let broadcastsCache = [];

    async function loadBroadcastsWithCache() {
      const res = await fetch('/api/broadcasts');
      const data = await res.json();
      broadcastsCache = data.broadcasts || [];
    }

    function openCreateModal() {
      editingId = null;
      document.getElementById('modalTitle').textContent = 'New Broadcast';
      document.getElementById('modalSubmitBtn').textContent = 'Create';
      // Clear form
      document.getElementById('fTitle').value = '';
      document.getElementById('fDescription').value = '';
      document.getElementById('fType').value = 'announcement';
      document.getElementById('fPriority').value = '0';
      document.getElementById('fActionLabel').value = 'Open Now';
      document.getElementById('fFeatureKey').value = '';
      document.getElementById('fActionUrl').value = '';
      document.getElementById('fDeepLink').value = '';
      document.getElementById('fImageUrl').value = '';
      currentTags = [];
      renderTagChips();
      document.getElementById('fDirectRedirect').checked = false;
      document.getElementById('fDismissible').checked = true;
      document.getElementById('fExpiresAt').value = '';
      document.getElementById('fTargetType').value = 'all';
      document.getElementById('fAutoNotify').checked = true;
      document.getElementById('fTargetGroupField').style.display = 'none';
      document.getElementById('broadcastModal').classList.add('active');
    }

    async function editBroadcast(id) {
      // Fetch fresh data
      await loadBroadcastsWithCache();
      const b = broadcastsCache.find(x => x.id === id);
      if (!b) return showToast('Broadcast not found', 'error');

      editingId = id;
      document.getElementById('modalTitle').textContent = 'Edit Broadcast';
      document.getElementById('modalSubmitBtn').textContent = 'Save Changes';

      document.getElementById('fTitle').value = b.title || '';
      document.getElementById('fDescription').value = b.description || '';
      document.getElementById('fType').value = b.type || 'announcement';
      document.getElementById('fPriority').value = b.priority || 0;
      document.getElementById('fActionLabel').value = b.actionLabel || 'Open Now';
      document.getElementById('fFeatureKey').value = b.featureKey || '';
      document.getElementById('fActionUrl').value = b.actionUrl || '';
      document.getElementById('fDeepLink').value = b.deepLink || '';
      document.getElementById('fImageUrl').value = b.imageUrl || '';
      let loadedTags = b.tags || [];
      if (typeof loadedTags === 'string') { try { loadedTags = JSON.parse(loadedTags); } catch(e) { loadedTags = []; } }
      currentTags = Array.isArray(loadedTags) ? JSON.parse(JSON.stringify(loadedTags)) : [];
      renderTagChips();
      document.getElementById('fDirectRedirect').checked = b.directRedirect || false;
      document.getElementById('fDismissible').checked = b.dismissible !== false;
      document.getElementById('fExpiresAt').value = b.expiresAt ? new Date(b.expiresAt).toISOString().slice(0, 16) : '';
      document.getElementById('fTargetType').value = b.targetType || 'all';
      document.getElementById('fTargetGroupId').value = b.targetGroupId || '';
      document.getElementById('fAutoNotify').checked = false; // Don't re-notify on edit
      toggleBroadcastTarget();

      document.getElementById('broadcastModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('broadcastModal').classList.remove('active');
      editingId = null;
    }

    let isSubmitting = false;
    async function submitBroadcast() {
      if (isSubmitting) return;
      const title = document.getElementById('fTitle').value.trim();
      if (!title) return showToast('Title is required', 'error');

      isSubmitting = true;
      const btn = document.getElementById('modalSubmitBtn');
      btn.disabled = true;
      btn.textContent = 'Sending...';

      const expiresAtStr = document.getElementById('fExpiresAt').value;
      const targetType = document.getElementById('fTargetType').value;
      const payload = {
        title,
        description: document.getElementById('fDescription').value.trim() || null,
        type: document.getElementById('fType').value,
        priority: document.getElementById('fPriority').value,
        actionLabel: document.getElementById('fActionLabel').value.trim() || 'Open Now',
        featureKey: document.getElementById('fFeatureKey').value || null,
        actionUrl: document.getElementById('fActionUrl').value.trim() || null,
        deepLink: document.getElementById('fDeepLink').value || null,
        imageUrl: document.getElementById('fImageUrl').value.trim() || null,
        tags: JSON.stringify(currentTags),
        directRedirect: document.getElementById('fDirectRedirect').checked,
        dismissible: document.getElementById('fDismissible').checked,
        expiresAt: expiresAtStr ? new Date(expiresAtStr).getTime() : null,
        targetType,
        targetGroupId: targetType === 'group' ? document.getElementById('fTargetGroupId').value : null,
        autoNotify: document.getElementById('fAutoNotify').checked
      };

      try {
        const url = editingId ? `/api/broadcasts/${editingId}` : '/api/broadcasts';
        const method = editingId ? 'PUT' : 'POST';
        const res = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.success) {
          const msg = editingId ? 'Broadcast updated' :
            (data.notifySent ? `Broadcast created — notification sent to ${data.notifySent} user${data.notifySent !== 1 ? 's' : ''}` : 'Broadcast created');
          showToast(msg);
          closeModal();
          loadBroadcasts();
        } else {
          showToast(data.error || 'Failed', 'error');
        }
      } catch (err) {
        showToast('Request failed', 'error');
      } finally {
        isSubmitting = false;
        btn.disabled = false;
        btn.textContent = editingId ? 'Save Changes' : 'Create';
      }
    }

    async function toggleBroadcast(id) {
      try {
        const res = await fetch(`/api/broadcasts/${id}/toggle`, { method: 'POST' });
        const data = await res.json();
        if (data.success) {
          showToast(data.active ? 'Broadcast activated' : 'Broadcast paused');
          loadBroadcasts();
        }
      } catch (err) {
        showToast('Failed to toggle', 'error');
      }
    }

    async function deleteBroadcast(id) {
      if (!confirm('Delete this broadcast? This cannot be undone.')) return;
      try {
        const res = await fetch(`/api/broadcasts/${id}`, { method: 'DELETE' });
        const data = await res.json();
        if (data.success) {
          showToast('Broadcast deleted');
          loadBroadcasts();
        }
      } catch (err) {
        showToast('Failed to delete', 'error');
      }
    }

    async function aiGenerate(type) {
      const context = prompt('Describe what you want (e.g., "evening reminder to complete tasks", "new calendar sync feature", "rate the app")');
      if (!context) return;

      showToast('✨ Generating with AI...', 'info');
      try {
        const res = await fetch('/api/ai/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ type, context })
        });
        const data = await res.json();
        if (data.success && data.generated) {
          const g = data.generated;
          if (g.title) document.getElementById('fTitle').value = g.title;
          if (g.description) document.getElementById('fDescription').value = g.description;
          if (g.actionLabel) document.getElementById('fActionLabel').value = g.actionLabel;
          showToast('✨ AI content generated!');
        } else {
          showToast(data.error || 'AI generation failed', 'error');
        }
      } catch (err) {
        showToast('AI request failed: ' + err.message, 'error');
      }
    }
  </script>
</body>
</html>
