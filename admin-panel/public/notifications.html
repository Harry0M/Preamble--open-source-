<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Push Notifications — Preamble Admin</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <h1>Preamble</h1>
        <span>Admin Panel</span>
      </div>
      <nav class="sidebar-nav">
        <a href="/dashboard" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          Dashboard
        </a>
        <a href="/users" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Users
        </a>
        <a href="/groups" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><circle cx="19" cy="7" r="3"/><path d="M21 21v-2a3 3 0 0 0-2-2.83"/></svg>
          Groups
        </a>
        <a href="/broadcasts" class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
          Broadcasts
        </a>
        <a href="/notifications" class="nav-item active">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          Notifications
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-info">
          <div class="user-avatar" id="adminAvatar"></div>
          <div class="user-meta">
            <div class="user-name" id="adminName">Admin</div>
            <div class="user-email" id="adminEmail">admin@email.com</div>
          </div>
        </div>
        <button type="button" class="logout-btn" onclick="logout()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Sign Out
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="page-header">
        <h2>Push Notifications</h2>
        <p>Send push notifications to users with optional deep links</p>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:2rem;">
        <!-- Send Notification Form -->
        <div class="card">
          <div class="card-header">
            <h3>Compose Notification</h3>
          </div>
          <div class="card-body">
            <div class="form-group">
              <label>Title *</label>
              <input type="text" class="form-control" id="nTitle" placeholder="e.g. New Feature Available!">
            </div>

            <div class="form-group">
              <label>Body *</label>
              <textarea class="form-control" id="nBody" placeholder="Write the notification message..." rows="3"></textarea>
            </div>

            <div class="form-group">
              <label>Target</label>
              <select class="form-control" id="nTarget" onchange="toggleTargetFields()">
                <option value="all">All Users</option>
                <option value="group">User Group</option>
                <option value="single">Specific User</option>
              </select>
            </div>

            <div class="form-group" id="targetGroupField" style="display:none;">
              <label>Select Group</label>
              <select class="form-control" id="nTargetGroup">
                <option value="">Loading groups...</option>
              </select>
            </div>

            <div class="form-group" id="targetUidGroup" style="display:none;">
              <label>User UID</label>
              <input type="text" class="form-control" id="nTargetUid" placeholder="Paste user UID here">
            </div>

            <div class="form-group">
              <label>Channel</label>
              <select class="form-control" id="nChannel">
                <option value="broadcast">Updates & Announcements (default priority)</option>
                <option value="promo">Offers & Tips (low priority)</option>
              </select>
            </div>

            <div class="form-group">
              <label>Deep Link (opens in-app screen)</label>
              <select class="form-control" id="nDeepLink">
                <option value="">None — just open the app</option>
                <option value="preamble://home">Home</option>
                <option value="preamble://settings">Settings</option>
                <option value="preamble://settings/theme">Settings &rarr; Theme</option>
                <option value="preamble://settings/calendar">Settings &rarr; Calendar</option>
                <option value="preamble://settings/notifications">Settings &rarr; Notifications</option>
                <option value="preamble://stats">Stats</option>
                <option value="preamble://calendar">Calendar</option>
              </select>
            </div>

            <div class="form-group">
              <label>External URL (opens browser instead of deep link)</label>
              <input type="url" class="form-control" id="nUrl" placeholder="https://example.com">
            </div>

            <button type="button" class="btn btn-primary" onclick="sendNotification()" style="width:100%;margin-top:0.5rem;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16" style="margin-right:6px;"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
              Send Notification
            </button>
          </div>
        </div>

        <!-- History -->
        <div class="card" style="align-self:start;">
          <div class="card-header">
            <h3>Recent History</h3>
          </div>
          <div id="historyContainer" style="max-height:600px;overflow-y:auto;">
            <div class="loading"><div class="spinner"></div> Loading...</div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      await checkAuth();
      loadHistory();
      loadGroupOptions();
    });

    function toggleTargetFields() {
      const target = document.getElementById('nTarget').value;
      document.getElementById('targetUidGroup').style.display = target === 'single' ? 'block' : 'none';
      document.getElementById('targetGroupField').style.display = target === 'group' ? 'block' : 'none';
    }

    async function loadGroupOptions() {
      try {
        const res = await fetch('/api/groups');
        const data = await res.json();
        const select = document.getElementById('nTargetGroup');
        if (!data.groups || data.groups.length === 0) {
          select.innerHTML = '<option value="">No groups created yet</option>';
          return;
        }
        select.innerHTML = data.groups.map(g =>
          `<option value="${g.id}">${escapeHtml(g.name)} (${g.filterType})</option>`
        ).join('');
      } catch (err) {
        console.error('Failed to load groups:', err);
      }
    }

    async function sendNotification() {
      const title = document.getElementById('nTitle').value.trim();
      const body = document.getElementById('nBody').value.trim();
      if (!title || !body) return showToast('Title and body are required', 'error');

      const targetType = document.getElementById('nTarget').value;
      const payload = {
        title,
        body,
        targetType,
        targetUid: targetType === 'single' ? document.getElementById('nTargetUid').value.trim() : null,
        targetGroupId: targetType === 'group' ? document.getElementById('nTargetGroup').value : null,
        channelType: document.getElementById('nChannel').value,
        deepLink: document.getElementById('nDeepLink').value || null,
        url: document.getElementById('nUrl').value.trim() || null
      };

      const btn = event.target;
      btn.disabled = true;
      btn.textContent = 'Sending...';

      try {
        const res = await fetch('/api/notifications/send', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.success) {
          showToast(`Notification sent to ${data.sent} user${data.sent !== 1 ? 's' : ''}`);
          // Clear form
          document.getElementById('nTitle').value = '';
          document.getElementById('nBody').value = '';
          loadHistory();
        } else {
          showToast(data.error || 'Failed to send', 'error');
        }
      } catch (err) {
        showToast('Request failed', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16" style="margin-right:6px;"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg> Send Notification`;
      }
    }

    async function loadHistory() {
      try {
        const res = await fetch('/api/notifications/history');
        const data = await res.json();
        const container = document.getElementById('historyContainer');

        if (!data.history || data.history.length === 0) {
          container.innerHTML = '<div class="empty-state"><h4>No notifications sent yet</h4></div>';
          return;
        }

        container.innerHTML = data.history.map(n => `
          <div style="padding:1rem 1.5rem;border-bottom:1px solid var(--glass-border);">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;">
              <div style="flex:1;min-width:0;">
                <div style="font-weight:600;font-size:0.875rem;color:var(--white);">${escapeHtml(n.title)}</div>
                <div style="font-size:0.8125rem;color:var(--gray-300);margin-top:2px;">${escapeHtml(n.body)}</div>
                <div style="display:flex;gap:0.75rem;margin-top:6px;font-size:0.6875rem;color:var(--gray-500);">
                  <span>${n.targetType === 'single' ? 'Single user' : 'All users'}</span>
                  <span>${n.sentCount} delivered</span>
                  ${n.deepLink ? `<span style="color:var(--accent);">${escapeHtml(n.deepLink)}</span>` : ''}
                </div>
              </div>
              <div style="font-size:0.6875rem;color:var(--gray-500);white-space:nowrap;margin-left:1rem;">${formatDate(n.sentAt)}</div>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error('Failed to load history:', err);
      }
    }
  </script>
</body>
</html>
